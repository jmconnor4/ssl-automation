name: PR Checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install app dependencies
        working-directory: ./app
        run: |
          if [ -f "package.json" ]; then
            npm ci
          else
            echo "No app/package.json found, skipping app dependencies"
          fi

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-bash:
    name: Run Bash Script Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies (for bats)
        run: npm ci

      - name: Install bats-core
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run bash tests
        run: npm run test:bash

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./app
        run: |
          if [ -f "package.json" ]; then
            npm ci
          else
            echo "No app/package.json found, skipping dependencies"
          fi

      - name: Run ESLint (if configured)
        working-directory: ./app
        run: |
          if [ -f "package.json" ]; then
            if npm run lint --if-present; then
              echo "Linting passed or no lint script found"
            fi
          else
            echo "No app/package.json found, skipping lint"
          fi
        continue-on-error: true

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Node.js application image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: false
          tags: ssl-automation-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test docker-compose configuration
        run: |
          docker-compose config

  nginx-config:
    name: Validate Nginx Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Nginx configuration syntax
        run: |
          docker run --rm -v $(pwd)/data/nginx:/etc/nginx/conf.d:ro nginx:1.15-alpine nginx -t -c /etc/nginx/nginx.conf || echo "Note: Nginx config test may fail if domain placeholders are not replaced"

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './app'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  app-server-test:
    name: Test App Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install app dependencies
        working-directory: ./app
        run: npm ci

      - name: Start app server in background
        working-directory: ./app
        run: |
          node server.js &
          echo $! > server.pid
          sleep 2

      - name: Wait for server to be ready
        run: |
          timeout 30 bash -c 'until curl -sf http://localhost:3000/health; do sleep 1; done'
          echo "Server is ready!"

      - name: Test server endpoints
        run: |
          echo "Testing health endpoint..."
          curl -f http://localhost:3000/health | jq .

          echo "Testing root endpoint..."
          curl -f http://localhost:3000/ | jq .

          echo "Testing info endpoint..."
          curl -f http://localhost:3000/api/info | jq .

          echo "Testing echo endpoint..."
          curl -f -X POST http://localhost:3000/api/echo \
            -H "Content-Type: application/json" \
            -d '{"message":"GitHub Actions test"}' | jq .

          echo "Testing 404 handler..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/nonexistent)
          if [ "$STATUS" = "404" ]; then
            echo "404 test passed (received status $STATUS)"
          else
            echo "404 test failed (received status $STATUS)"
            exit 1
          fi

      - name: Stop app server
        if: always()
        working-directory: ./app
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi
